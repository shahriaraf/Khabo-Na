name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup project (platform folders, permissions, packages)
        run: dart run tool/app.dart setup

      - name: Build release APK
        env:
          API_BASE: ${{ secrets.API_BASE }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: dart run tool/app.dart build apk "$API_BASE" "$APP_TOKEN"

      - name: Save APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: khabo-na-apk
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Khabo Na build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*-release.apk